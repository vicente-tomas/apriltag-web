<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión SoftRobot 🚀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260819-3">
</head>
<body>
    <main>
        <header class="hero">
            <span class="mission-badge">MISIÓN 01</span>
            <h1>Centro de Mando 🤖</h1>
            <p>¡Mueve tu robot y dibuja una ruta con el AprilTag!</p>
        </header>

        <section class="camera-card" aria-label="Cámara y recorrido del robot">
            <div class="camera-status"><span class="status-light"></span> CÁMARA EN VIVO</div>
            <video id="camera-stream" autoplay playsinline muted></video>
            <canvas id="output-canvas"></canvas>
            <canvas id="trail-canvas" aria-hidden="true"></canvas>
            <div class="camera-hint">Busca el marcador <strong>36h11 · ID 0</strong></div>
        </section>

        <div class="controls">
            <button id="finish-trail" class="finish-button" type="button" disabled>Marcar meta 🏁</button>
            <button id="clear-trail" type="button">Nueva misión 🚀</button>
        </div>

        <section id="info-panel" aria-live="polite">
            <article class="info-card tag-card">
                <h2>Estado del robot</h2>
                <pre id="tag-data">Preparando detector...</pre>
            </article>
            <article class="info-card camera-data-card">
                <h2>Datos de la cámara</h2>
                <pre id="camera-data">Solicitando permiso...</pre>
            </article>
        </section>
    </main>
    <script src="https://unpkg.com/comlink/dist/umd/comlink.js"></script>
    <script src="app.js?v=20260819-3"></script>
</body>
</html>
